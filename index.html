<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luck Game - Global Leaderboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f0f0f0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }

        .luck-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 72px;
            font-weight: bold;
            padding: 40px;
            border-radius: 15px;
            margin: 20px 0;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .luck-display.animate {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
            font-weight: 500;
            text-align: center;
        }

        .emoji {
            font-size: 40px;
            margin-top: 10px;
            text-align: center;
        }

        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        .leaderboard {
            margin-top: 20px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .leaderboard-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .leaderboard-item.current-user {
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            border: 2px solid #667eea;
        }

        .rank {
            font-size: 24px;
            font-weight: bold;
            margin-right: 15px;
            min-width: 40px;
        }

        .rank.gold { color: #FFD700; }
        .rank.silver { color: #C0C0C0; }
        .rank.bronze { color: #CD7F32; }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 16px;
        }

        .user-score {
            color: #666;
            font-size: 14px;
        }

        .score-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('game')">🎮 Game</button>
            <button class="tab" onclick="switchTab('leaderboard')">🏆 Leaderboard</button>
        </div>

        <!-- Game Tab -->
        <div id="gameTab" class="tab-content active">
            <h1>🍀 Luck Game</h1>
            <p class="subtitle">Press the button and discover your luck!</p>
            
            <div class="luck-display" id="luckDisplay">?</div>
            
            <button class="button" onclick="checkLuck()">Test Your Luck</button>
            
            <div class="message" id="message"></div>
            <div class="emoji" id="emoji"></div>
            
            <div class="user-info" id="userInfo"></div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="bestScore">-</div>
                    <div class="stat-label">Best Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalGames">-</div>
                    <div class="stat-label">Games Played</div>
                </div>
            </div>
        </div>

        <!-- Leaderboard Tab -->
        <div id="leaderboardTab" class="tab-content">
            <h1>🏆 Global Leaderboard</h1>
            <p class="subtitle">Top players from around the world!</p>
            
            <div id="leaderboardContent" class="loading">
                Loading leaderboard...
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        let currentUser = null;
        let userStats = { bestScore: 0, totalGames: 0 };

        // Initialize user
        if (tg.initDataUnsafe.user) {
            currentUser = {
                id: tg.initDataUnsafe.user.id,
                firstName: tg.initDataUnsafe.user.first_name,
                lastName: tg.initDataUnsafe.user.last_name || '',
                username: tg.initDataUnsafe.user.username || ''
            };
            
            document.getElementById('userInfo').innerHTML = 
                `👤 Hello, ${currentUser.firstName}!`;
            
            loadUserStats();
        }

        // Switch tabs
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            
            if (tabName === 'game') {
                document.querySelector('.tab:first-child').classList.add('active');
                document.getElementById('gameTab').classList.add('active');
            } else {
                document.querySelector('.tab:last-child').classList.add('active');
                document.getElementById('leaderboardTab').classList.add('active');
                loadLeaderboard();
            }
        }

        // Load user stats
        async function loadUserStats() {
            try {
                const result = await window.storage.get(`user_${currentUser.id}`);
                if (result && result.value) {
                    userStats = JSON.parse(result.value);
                    document.getElementById('bestScore').textContent = userStats.bestScore;
                    document.getElementById('totalGames').textContent = userStats.totalGames;
                } else {
                    document.getElementById('bestScore').textContent = '0';
                    document.getElementById('totalGames').textContent = '0';
                }
            } catch (error) {
                console.log('No previous stats found');
                document.getElementById('bestScore').textContent = '0';
                document.getElementById('totalGames').textContent = '0';
            }
        }

        // Save user stats
        async function saveUserStats(score) {
            userStats.totalGames++;
            if (score > userStats.bestScore) {
                userStats.bestScore = score;
            }
            
            try {
                await window.storage.set(`user_${currentUser.id}`, JSON.stringify(userStats));
                
                // Save to global leaderboard
                const leaderboardEntry = {
                    id: currentUser.id,
                    firstName: currentUser.firstName,
                    lastName: currentUser.lastName,
                    username: currentUser.username,
                    score: userStats.bestScore,
                    totalGames: userStats.totalGames,
                    timestamp: Date.now()
                };
                
                await window.storage.set(`leaderboard_${currentUser.id}`, JSON.stringify(leaderboardEntry), true);
                
                document.getElementById('bestScore').textContent = userStats.bestScore;
                document.getElementById('totalGames').textContent = userStats.totalGames;
            } catch (error) {
                console.error('Error saving stats:', error);
            }
        }

        // Check luck
        async function checkLuck() {
            if (!currentUser) {
                alert('Please open this app from Telegram!');
                return;
            }

            let luck = Math.floor(Math.random() * 100) + 1;
            
            let display = document.getElementById('luckDisplay');
            let message = document.getElementById('message');
            let emoji = document.getElementById('emoji');
            
            display.classList.add('animate');
            display.textContent = luck;
            
            if (luck >= 90) {
                message.textContent = "Amazing! You're incredibly lucky today! 🎉";
                emoji.textContent = "🌟";
                tg.HapticFeedback.notificationOccurred('success');
            } else if (luck >= 70) {
                message.textContent = "Great result! Your luck is shining!";
                emoji.textContent = "😊";
                tg.HapticFeedback.notificationOccurred('success');
            } else if (luck >= 50) {
                message.textContent = "Not bad, average luck!";
                emoji.textContent = "🙂";
                tg.HapticFeedback.notificationOccurred('warning');
            } else if (luck >= 30) {
                message.textContent = "A bit low, try again!";
                emoji.textContent = "😐";
                tg.HapticFeedback.notificationOccurred('warning');
            } else {
                message.textContent = "Not your lucky day...";
                emoji.textContent = "😢";
                tg.HapticFeedback.notificationOccurred('error');
            }
            
            setTimeout(() => {
                display.classList.remove('animate');
            }, 500);

            await saveUserStats(luck);
        }

        // Load leaderboard
        async function loadLeaderboard() {
            const content = document.getElementById('leaderboardContent');
            content.innerHTML = '<div class="loading">Loading leaderboard...</div>';
            
            try {
                const result = await window.storage.list('leaderboard_', true);
                
                if (!result || !result.keys || result.keys.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🏆</div>
                            <div>No scores yet! Be the first to play!</div>
                        </div>
                    `;
                    return;
                }
                
                const leaderboardData = [];
                for (const key of result.keys) {
                    try {
                        const data = await window.storage.get(key, true);
                        if (data && data.value) {
                            leaderboardData.push(JSON.parse(data.value));
                        }
                    } catch (e) {
                        console.error('Error loading entry:', e);
                    }
                }
                
                leaderboardData.sort((a, b) => b.score - a.score);
                
                let html = '<div class="leaderboard">';
                leaderboardData.forEach((entry, index) => {
                    const rank = index + 1;
                    let rankClass = '';
                    let rankEmoji = `${rank}.`;
                    
                    if (rank === 1) { rankClass = 'gold'; rankEmoji = '🥇'; }
                    else if (rank === 2) { rankClass = 'silver'; rankEmoji = '🥈'; }
                    else if (rank === 3) { rankClass = 'bronze'; rankEmoji = '🥉'; }
                    
                    const isCurrentUser = currentUser && entry.id === currentUser.id;
                    const userName = entry.firstName + (entry.lastName ? ' ' + entry.lastName : '');
                    
                    html += `
                        <div class="leaderboard-item ${isCurrentUser ? 'current-user' : ''}">
                            <div class="rank ${rankClass}">${rankEmoji}</div>
                            <div class="user-details">
                                <div class="user-name">${userName} ${isCurrentUser ? '(You)' : ''}</div>
                                <div class="user-score">${entry.totalGames} games played</div>
                            </div>
                            <div class="score-badge">${entry.score}</div>
                        </div>
                    `;
                });
                html += '</div>';
                
                content.innerHTML = html;
                
            } catch (error) {
                console.error('Error loading leaderboard:', error);
                content.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">❌</div>
                        <div>Error loading leaderboard. Please try again.</div>
                    </div>
                `;
            }
        }

        if (tg.themeParams.bg_color) {
            document.body.style.background = tg.themeParams.bg_color;
        }
    </script>
</body>
</html>
