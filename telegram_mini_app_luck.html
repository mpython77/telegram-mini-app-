<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Your Luck</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .luck-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 72px;
            font-weight: bold;
            padding: 40px;
            border-radius: 15px;
            margin: 30px 0;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s ease;
        }

        .luck-display.animate {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .button:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
            font-weight: 500;
            min-height: 30px;
        }

        .emoji {
            font-size: 40px;
            margin-top: 10px;
        }

        .user-info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍀 Luck Game</h1>
        <p class="subtitle">Press the button and discover your luck!</p>
        
        <div class="luck-display" id="luckDisplay">?</div>
        
        <button class="button" onclick="checkLuck()">Test Your Luck</button>
        
        <div class="message" id="message"></div>
        <div class="emoji" id="emoji"></div>
        
        <div class="user-info" id="userInfo"></div>
    </div>

    <script>
        // Initialize Telegram Web App SDK
        let tg = window.Telegram.WebApp;
        tg.expand();
        
        // Display user information
        if (tg.initDataUnsafe.user) {
            let user = tg.initDataUnsafe.user;
            document.getElementById('userInfo').innerHTML = 
                `👤 Hello, ${user.first_name}!`;
        }

        function checkLuck() {
            // Random number (1-100)
            let luck = Math.floor(Math.random() * 100) + 1;
            
            let display = document.getElementById('luckDisplay');
            let message = document.getElementById('message');
            let emoji = document.getElementById('emoji');
            
            // Animation
            display.classList.add('animate');
            display.textContent = luck;
            
            // Message and emoji based on luck score
            if (luck >= 90) {
                message.textContent = "Amazing! You're incredibly lucky today! 🎉";
                emoji.textContent = "🌟";
                tg.HapticFeedback.notificationOccurred('success');
            } else if (luck >= 70) {
                message.textContent = "Great result! Your luck is shining!";
                emoji.textContent = "😊";
                tg.HapticFeedback.notificationOccurred('success');
            } else if (luck >= 50) {
                message.textContent = "Not bad, average luck!";
                emoji.textContent = "🙂";
                tg.HapticFeedback.notificationOccurred('warning');
            } else if (luck >= 30) {
                message.textContent = "A bit low, try again!";
                emoji.textContent = "😐";
                tg.HapticFeedback.notificationOccurred('warning');
            } else {
                message.textContent = "Not your lucky day...";
                emoji.textContent = "😢";
                tg.HapticFeedback.notificationOccurred('error');
            }
            
            // Remove animation
            setTimeout(() => {
                display.classList.remove('animate');
            }, 500);
        }
        
        // Apply Telegram theme colors (optional)
        if (tg.themeParams.bg_color) {
            document.body.style.background = tg.themeParams.bg_color;
        }
    </script>
</body>
</html>
